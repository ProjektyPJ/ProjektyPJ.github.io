<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aero Glass Nav</title>
<link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<p class="demo-label">Aero Glass — Navigation Bar</p>

<!-- Nav 1: Standard horizontal nav -->
<nav class="aero" role="navigation" aria-label="Main navigation">
  <a class="aero-logo" href="#">
    <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="10" cy="10" r="9" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.70)" stroke-width="1"/>
      <path d="M6 10 L10 6 L14 10 L10 14 Z" fill="rgba(255,255,255,0.85)"/>
    </svg>
    AeroUI
  </a>

  <ul class="aero-items">
    <li>
      <a href="#" class="active" aria-current="page">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M2 6l5-4 5 4v6H9V9H5v3H2V6z"/>
        </svg>
        Home
      </a>
    </li>
    <li>
      <a href="#">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <rect x="2" y="3" width="10" height="8" rx="1"/>
          <path d="M5 3V2M9 3V2"/>
        </svg>
        Programs
      </a>
    </li>
    <li>
      <a href="#">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <circle cx="7" cy="7" r="5"/>
          <path d="M7 5v2l1.5 1.5"/>
        </svg>
        History
      </a>
    </li>
    <li>
      <a href="#">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M7 2v10M2 7h10"/>
        </svg>
        Downloads
      </a>
    </li>
    <li>
      <a href="#">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <circle cx="7" cy="5" r="2.5"/>
          <path d="M2 12c0-2.5 2-4 5-4s5 1.5 5 4"/>
        </svg>
        Account
      </a>
    </li>
  </ul>

  <div class="aero-spacer"></div>

  <div class="aero-search">
    <input type="text" placeholder="Search…" aria-label="Search">
    <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="6" cy="6" r="4"/><path d="M10 10l2 2"/>
    </svg>
  </div>
</nav>

<p class="demo-label">Aero Glass — Window Tab Bar</p>

<!-- Nav 2: Window-style tab bar -->
<nav class="aero-dark" role="navigation" aria-label="Window tabs">
  <div class="tab active">
    <svg viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M2 5.5l4.5-3.5 4.5 3.5v5.5H8V8H5v3H2V5.5z"/>
    </svg>
    Desktop
  </div>

  <div class="tab">
    <svg viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M2 3h9v7H2z"/><path d="M5 10v1.5M8 10v1.5M4 11.5h5"/>
    </svg>
    Documents
  </div>

  <div class="sep" aria-hidden="true"></div>

  <div class="tab">
    <svg viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="6.5" cy="6.5" r="4.5"/>
      <path d="M6.5 4v2.5l1.5 1"/>
    </svg>
    Recent
  </div>

  <div class="tab">
    <svg viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M6.5 2L8 5.2l3.5.5-2.5 2.4.6 3.4L6.5 10 3.4 11.5l.6-3.4L1.5 5.7l3.5-.5z"/>
    </svg>
    Favorites
  </div>

  <div class="tab">
    <svg viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="6.5" cy="4.5" r="2.5"/>
      <path d="M2 11.5c0-2.5 2-4 4.5-4s4.5 1.5 4.5 4"/>
    </svg>
    Network
  </div>

  <div class="win-buttons" aria-label="Window controls">
    <div class="win-btn" title="Minimize">─</div>
    <div class="win-btn" title="Restore">▭</div>
    <div class="win-btn close" title="Close">✕</div>
  </div>
</nav>

</body>
</html>
